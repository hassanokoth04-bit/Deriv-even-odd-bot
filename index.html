<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Even/Odd Bot V5</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#17202a}
    .box{max-width:520px;margin:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}
    h1{margin-top:0;font-size:25px}
    button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
    #connect{background:#ff444f;color:white}
    #disconnect{background:#555;color:white}
    #trade{background:#18a558;color:white}
    #trade:disabled,#disconnect:disabled{opacity:.45}
    .status{padding:12px;border-radius:10px;background:#eef1f4;margin:12px 0;word-break:break-word}
    .ok{background:#e8f7ee}
    .bad{background:#fdeaea}
    label{display:block;margin-top:12px;font-weight:700}
    input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3da;border-radius:9px;margin-top:6px}
    small{color:#667}
    #log{background:#111;color:#eee;padding:12px;border-radius:10px;min-height:100px;white-space:pre-wrap;font-size:12px}
  </style>
</head>
<body>
<div class="box">
  <h1>Deriv Even/Odd Bot V5</h1>
  <p>OAuth connection test for your Deriv account.</p>

  <div id="status" class="status">Not connected</div>

  <button id="connect">Connect to Deriv</button>
  <button id="disconnect" disabled>Disconnect</button>

  <label>Stake</label>
  <input id="stake" type="number" min="0.35" step="0.01" value="1">

  <label>Contract duration (ticks)</label>
  <input id="duration" type="number" min="1" max="10" value="1">

  <button id="trade" disabled>Test Trade — OFF</button>

  <small>
    V5 only tests authentication/account connection. Trading is disabled until you
    deliberately press the test-trade button.
  </small>

  <h3>Log</h3>
  <div id="log"></div>
</div>

<script>
const APP_ID = "34eUE5W4X4BBYRnAAoXWs";
const REDIRECT_URI = "https://hassanokoth04-bit.github.io/Deriv-even-odd-bot/";
const WS_URL = "wss://ws.derivws.com/websockets/v3?app_id=" + encodeURIComponent(APP_ID);

let ws = null;
let token = null;
let account = null;

const $ = id => document.getElementById(id);
function log(msg){
  const t = new Date().toLocaleTimeString();
  $("log").textContent += `[${t}] ${msg}\n`;
  $("log").scrollTop = $("log").scrollHeight;
}
function status(msg, good=false){
  $("status").textContent = msg;
  $("status").className = "status " + (good ? "ok" : "bad");
}
function setConnected(on){
  $("connect").disabled = on;
  $("disconnect").disabled = !on;
  $("trade").disabled = !on;
  $("trade").textContent = on ? "Test Trade — OFF" : "Test Trade — OFF";
}

// Parse Deriv OAuth tokens returned in the URL hash.
// Example: #acct1=...&token1=...&cur1=USD
function readOAuthHash(){
  if(!location.hash || location.hash.length < 2) return false;

  const p = new URLSearchParams(location.hash.substring(1));
  let found = false;

  for(const [key,value] of p.entries()){
    if(key.toLowerCase().startsWith("token") && value){
      token = value;
      found = true;
      break;
    }
  }

  for(const [key,value] of p.entries()){
    if(key.toLowerCase().startsWith("acct") && value){
      account = value;
      break;
    }
  }

  if(found){
    history.replaceState(null, "", REDIRECT_URI);
    log("OAuth token received by the website.");
    return true;
  }
  return false;
}

function connectOAuth(){
  const url =
    "https://oauth.deriv.com/oauth2/authorize" +
    "?app_id=" + encodeURIComponent(APP_ID) +
    "&l=EN" +
    "&brand=deriv" +
    "&redirect_uri=" + encodeURIComponent(REDIRECT_URI);

  log("Opening Deriv authorization...");
  // Use a normal browser navigation. The OAuth result returns to REDIRECT_URI.
  window.location.href = url;
}

function connectWebSocket(){
  if(!token){
    status("No OAuth token received.");
    log("Connection stopped: no token was returned.");
    return;
  }

  status("Connecting to Deriv...");
  log("Opening secure WebSocket...");

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    log("WebSocket connected.");
    ws.send(JSON.stringify({authorize: token}));
  };

  ws.onmessage = e => {
    let data;
    try { data = JSON.parse(e.data); }
    catch { log("Received unreadable response."); return; }

    if(data.error){
      status("Deriv error: " + data.error.message);
      log("ERROR: " + data.error.message);
      setConnected(false);
      return;
    }

    if(data.msg_type === "authorize"){
      const a = data.authorize;
      const loginid = a.loginid || account || "Connected account";
      account = loginid;

      status("Connected: " + loginid, true);
      log("Authorized successfully.");
      log("Account: " + loginid);
      log("Currency: " + (a.currency || "unknown"));
      log("Balance: " + (a.balance ?? "unknown"));
      setConnected(true);
    }
  };

  ws.onerror = () => {
    status("WebSocket connection failed.");
    log("WebSocket error.");
    setConnected(false);
  };

  ws.onclose = () => {
    if($("disconnect").disabled === false){
      log("WebSocket closed.");
    }
  };
}

function disconnect(){
  token = null;
  account = null;
  if(ws) ws.close();
  ws = null;
  setConnected(false);
  status("Disconnected");
  log("Disconnected.");
}

$("connect").addEventListener("click", connectOAuth);
$("disconnect").addEventListener("click", disconnect);

// Deliberately disabled trading logic for this diagnostic build.
// This prevents accidental live trades while we verify OAuth.
$("trade").addEventListener("click", () => {
  alert("Trading is intentionally disabled in V5 until the account connection is verified.");
});

// On page load, process a token returned by OAuth.
if(readOAuthHash()){
  connectWebSocket();
} else {
  setConnected(false);
  log("Ready. Tap Connect to Deriv.");
}
</script>
</body>
</html>
