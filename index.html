<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Even/Odd Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #1f2937;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input,
    select {
      background: #374151;
      color: white;
    }

    button {
      margin-top: 15px;
      background: #10b981;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: #374151;
      margin-top: 15px;
    }

    .result {
      font-size: 28px;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }

    .log {
      background: #111827;
      border-radius: 8px;
      padding: 10px;
      height: 150px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎯 Deriv Even/Odd Bot</h1>

  <div class="card">

    <div class="status" id="status">
      Disconnected
    </div>

    <button id="connectBtn">
      Connect to Deriv
    </button>

  </div>

  <div class="card">

    <label for="symbol">Market</label>

    <select id="symbol">
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
    </select>

    <label for="stake">Stake</label>

    <input
      id="stake"
      type="number"
      value="1"
      min="0.35"
      step="0.01"
    >

    <button id="startBtn" disabled>
      Start Bot
    </button>

    <button id="stopBtn" disabled>
      Stop Bot
    </button>

  </div>

  <div class="card">

    <div>
      Last Digit:
    </div>

    <div class="result" id="digit">
      -
    </div>

    <div class="status" id="tradeStatus">
      Waiting...
    </div>

  </div>

  <div class="card">

    <strong>Activity Log</strong>

    <div class="log" id="log"></div>

  </div>

</div>

<script>

  /*
    IMPORTANT:
    The Deriv API token is NOT stored in this file.

    The website connects to our Render backend.
  */

  const BACKEND_URL =
    "https://deriv-even-odd-bot.onrender.com";

    const WS_URL =
    "wss://deriv-even-odd-bot.onrender.com/ws";

    const HEALTH_URL =
    "https://deriv-even-odd-bot.onrender.com/api/status";

  const APP_ID = "167308681";

  let socket = null;
  let botRunning = false;

  const status = document.getElementById("status");
  const connectBtn = document.getElementById("connectBtn");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const digitDisplay = document.getElementById("digit");
  const tradeStatus = document.getElementById("tradeStatus");
  const logBox = document.getElementById("log");
  const symbolSelect = document.getElementById("symbol");

  function log(message) {

    const time =
      new Date().toLocaleTimeString();

    logBox.textContent +=
      `[${time}] ${message}\n`;

    logBox.scrollTop =
      logBox.scrollHeight;
  }

  function setStatus(message) {

    status.textContent = message;

  }

  connectBtn.addEventListener("click", connectToDeriv);

    async function connectToDeriv() {

    if (socket &&
        socket.readyState === WebSocket.OPEN) {

      log("Already connected.");

      return;
    }

    setStatus("Checking Render backend...");
    connectBtn.disabled = true;

    log("Checking Render backend...");
    log("Backend: " + BACKEND_URL);

    try {
      const response = await fetch(HEALTH_URL, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Backend returned HTTP " + response.status);
      }

      const health = await response.json();
      log("Render backend is reachable.");

      if (health.app_id && health.app_id !== APP_ID) {
        throw new Error("Backend App ID mismatch.");
      }

      if (!health.token_configured) {
        throw new Error("Render API token is not configured.");
      }
    } catch (error) {
      log("Backend check failed: " + error.message);
      setStatus("Could not reach Render backend");
      connectBtn.disabled = false;
      return;
    }

    setStatus("Opening secure WebSocket...");
    log("Opening WebSocket: " + WS_URL);

    try {

      socket = new WebSocket(WS_URL);

    } catch (error) {

      log("WebSocket error: " + error.message);

      setStatus("Connection failed");

      connectBtn.disabled = false;

      return;
    }

    socket.onopen = function() {

      log("Connected to Render backend.");

      setStatus("Connecting to Deriv...");

    };

    socket.onmessage = function(event) {

      let data;

      try {

        data = JSON.parse(event.data);

      } catch {

        log("Received invalid server message.");

        return;
      }

      console.log("Server:", data);

      if (data.type === "deriv_connection") {

        if (data.status === "connected") {

          log("Connected to Deriv.");

          setStatus("Authorizing Deriv account...");

        }

        if (data.status === "closed") {

          log(
            "Deriv connection closed. Code: " +
            data.code
          );

          setStatus("Deriv disconnected");

          startBtn.disabled = true;
        }

      }

      if (data.type === "authorized") {

        log("Deriv account authorized successfully.");

        setStatus("Connected to Deriv ✓");

        startBtn.disabled = false;

        connectBtn.disabled = true;

      }

      if (data.type === "deriv_error") {

        log(
          "Deriv API error: " +
          JSON.stringify(data.error)
        );

        setStatus("Deriv API error");

        connectBtn.disabled = false;

      }

      if (data.type === "error") {

        log("Backend error: " + data.error);

        setStatus("Backend error");

        connectBtn.disabled = false;

      }

      /*
        Tick response.
      */

      if (data.msg_type === "tick") {

        if (
          data.tick &&
          data.tick.quote !== undefined
        ) {

          const quote =
            String(data.tick.quote);

          const lastDigit =
            quote.slice(-1);

          digitDisplay.textContent =
            lastDigit;

          tradeStatus.textContent =
            Number(lastDigit) % 2 === 0
              ? "EVEN"
              : "ODD";
        }
      }

    };

    socket.onerror = function(error) {

      console.log(error);

      log("Could not reach Render backend.");

      setStatus("Could not reach Render backend");

      connectBtn.disabled = false;

    };

    socket.onclose = function() {

      log("Website connection closed.");

      setStatus("Disconnected");

      connectBtn.disabled = false;

      startBtn.disabled = true;

      stopBtn.disabled = true;

      botRunning = false;

    };

  }

  startBtn.addEventListener("click", startBot);

  function startBot() {

    if (
      !socket ||
      socket.readyState !== WebSocket.OPEN
    ) {

      log("Not connected.");

      return;
    }

    const symbol =
      symbolSelect.value;

    /*
      Subscribe to live ticks.
    */

    socket.send(JSON.stringify({

      ticks: symbol,
      subscribe: 1

    }));

    botRunning = true;

    startBtn.disabled = true;

    stopBtn.disabled = false;

    tradeStatus.textContent =
      "Monitoring " + symbol;

    log(
      "Bot started. Monitoring " +
      symbol
    );

  }

  stopBtn.addEventListener("click", stopBot);

  function stopBot() {

    if (
      socket &&
      socket.readyState === WebSocket.OPEN
    ) {

      socket.send(JSON.stringify({

        forget_all: "ticks"

      }));

    }

    botRunning = false;

    startBtn.disabled = false;

    stopBtn.disabled = true;

    tradeStatus.textContent =
      "Bot stopped";

    log("Bot stopped.");

  }

</script>

</body>
</html>
