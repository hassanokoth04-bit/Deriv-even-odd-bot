<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deriv Even/Odd Bot V6</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#17202a}
.card{max-width:520px;margin:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}
h1{margin:0 0 8px;font-size:24px}.muted{color:#667;font-size:14px;line-height:1.45}
label{display:block;font-weight:700;margin-top:16px}
input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#connect{background:#18a558;color:#fff}#disconnect{background:#555;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.status{padding:12px;border-radius:10px;background:#eef1f4;margin:16px 0;word-break:break-word}
.ok{background:#e8f7ee}.bad{background:#fdeaea}
pre{background:#111;color:#eee;border-radius:10px;padding:12px;min-height:90px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px}
.warning{margin-top:14px;padding:11px;border-radius:9px;background:#fff4d6;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>Deriv Even/Odd Bot V6</h1>
<p class="muted">Direct API-token connection using Deriv WebSocket. No OAuth redirect and no Deriv-app handoff.</p>
<label for="token">Deriv API Token</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste your token here">
<button id="connect">Authorize & Test Connection</button>
<button id="disconnect" disabled>Disconnect</button>
<div id="status" class="status">Not connected</div>
<h3>Connection log</h3>
<pre id="log"></pre>
<div class="warning"><strong>Security:</strong> Your token is used only in this browser session. Do not put your token inside this HTML file or GitHub.</div>
</div>
<script>
const APP_ID = "34eUE5W4X4BBYRnAAoXWs";
const WS_URL = "wss://ws.derivws.com/websockets/v3?app_id=" + encodeURIComponent(APP_ID);
let ws = null;
const $ = id => document.getElementById(id);

function log(message){
  const time = new Date().toLocaleTimeString();
  $("log").textContent += "[" + time + "] " + message + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}
function setStatus(message, good=false){
  $("status").textContent = message;
  $("status").className = "status " + (good ? "ok" : "bad");
}
function disconnect(){
  if(ws){try{ws.close();}catch(e){}}
  ws = null;
  $("disconnect").disabled = true;
  $("connect").disabled = false;
  setStatus("Disconnected");
  log("Disconnected.");
}
function connect(){
  const token = $("token").value.trim();
  if(!token){
    setStatus("Enter your Deriv API token first.");
    log("No token entered.");
    return;
  }
  if(ws){try{ws.close();}catch(e){}}
  $("connect").disabled = true;
  $("disconnect").disabled = true;
  setStatus("Connecting to Deriv...");
  log("App ID: " + APP_ID);
  log("WebSocket URL: " + WS_URL);
  log("Opening secure WebSocket...");
  try{
    ws = new WebSocket(WS_URL);
  }catch(error){
    setStatus("Browser could not create the WebSocket.");
    log("WebSocket creation error: " + (error.message || error));
    $("connect").disabled = false;
    return;
  }
  ws.onopen = function(){
    log("SUCCESS: WebSocket connection opened.");
    log("Sending authorization request...");
    try{
      ws.send(JSON.stringify({authorize: token}));
      log("Authorization request sent.");
    }catch(error){
      log("Send error: " + (error.message || error));
    }
  };
  ws.onmessage = function(event){
    log("Received response from Deriv.");
    let data;
    try{data = JSON.parse(event.data);}
    catch(error){
      log("Could not read Deriv response.");
      log(String(event.data));
      return;
    }
    log("Response type: " + (data.msg_type || "unknown"));
    if(data.error){
      const code = data.error.code || "UNKNOWN";
      const message = data.error.message || "Unknown Deriv error";
      setStatus("Deriv rejected request: " + message);
      log("API ERROR CODE: " + code);
      log("API ERROR MESSAGE: " + message);
      $("connect").disabled = false;
      $("disconnect").disabled = true;
      return;
    }
    if(data.msg_type === "authorize"){
      const a = data.authorize || {};
      const loginid = a.loginid || "Unknown";
      setStatus("CONNECTED — " + loginid, true);
      log("================================");
      log("AUTHORIZATION SUCCESSFUL");
      log("Account: " + loginid);
      log("Currency: " + (a.currency || "unknown"));
      log("Balance: " + (a.balance !== undefined ? a.balance : "unknown"));
      log("================================");
      $("disconnect").disabled = false;
      $("connect").disabled = true;
      return;
    }
    log("Deriv response: " + JSON.stringify(data));
  };
  ws.onerror = function(){
    setStatus("WebSocket connection error.");
    log("================================");
    log("WEBSOCKET ERROR");
    log("The browser reported a WebSocket error.");
    log("See the close code/reason below.");
    log("================================");
    $("connect").disabled = false;
    $("disconnect").disabled = true;
  };
  ws.onclose = function(event){
    log("================================");
    log("WEBSOCKET CLOSED");
    log("Close code: " + event.code);
    log("Close reason: " + (event.reason || "(none provided)"));
    log("Clean close: " + event.wasClean);
    log("================================");
    if(event.code !== 1000){
      setStatus("Connection closed. Code " + event.code + (event.reason ? " — " + event.reason : ""));
    }
    ws = null;
    $("connect").disabled = false;
    $("disconnect").disabled = true;
  };
}
$("connect").addEventListener("click", connect);
$("disconnect").addEventListener("click", disconnect);
log("Ready.");
log("Enter your Deriv token and tap Authorize & Test Connection.");
</script>
</body>
</html>
